# ------------------------------------------
# CUSTOMIZABLE TEMPLATE REPOSITORY VARIABLES
# 
environment:
  APP_DIR_NAME: "Fast Image Viewer"
  SOLUTION_EXT: "slnx"
# ------------------------------------------

version: CI Build {Build}
skip_commits:
  files:
  - '.github/**/*'
  - 'Docs/**/*'
  - 'Documents/**/*'
  - 'Manual/**/*'
  - 'Images/**/*'
  - 'Scripts/**/*'
  - 'Website/**/*'
  - '*.md'
  - '*.zip'
  - '*.yml'
image: Visual Studio 2026
configuration: Release

install:
  - >-
    choco install chocolatey-dotnetfx.extension --no-progress -y
  - >-
    git submodule update --init --recursive

before_build:
  - dotnet nuget locals all --clear
  - >-
    dotnet restore "Source\%APP_DIR_NAME%.%SOLUTION_EXT%"

build_script:
  - msbuild "Source\%APP_DIR_NAME%.%SOLUTION_EXT%" /p:Configuration=%configuration% /maxcpucount

test_script:
  - dotnet test "Source\%APP_DIR_NAME%.%SOLUTION_EXT%" -c %configuration% -p:TestingPlatformDotnetTestSupport=true

after_build:
  - >-
    7z a -r "%APPVEYOR_PROJECT_NAME%_Build_%APPVEYOR_BUILD_NUMBER%.zip"
    -i!"Source\*\bin\*"
    -x!"Source\Tests\bin\*"
    -x!"Source\*.Tests\bin\*"

artifacts:
  - path: "%APPVEYOR_PROJECT_NAME%_Build_%APPVEYOR_BUILD_NUMBER%.zip"
    name: "%APPVEYOR_PROJECT_NAME%"
